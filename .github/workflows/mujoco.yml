name: mujoco-optional

on:
  workflow_dispatch:

jobs:
  physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,mujoco]"
      - run: git clone --depth 1 https://github.com/google-deepmind/mujoco_menagerie third_party/mujoco_menagerie
      - name: Run physics execution tests headlessly
        env:
          MUJOCO_GL: egl
        run: python -m pytest -q tests/test_execution.py
