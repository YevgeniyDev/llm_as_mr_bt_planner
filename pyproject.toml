[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-mr-bt-planner"
version = "0.7.0"
description = "Generate, validate, and contract-simulate LLM-authored synchronized multi-robot Behavior Trees."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LLM-as-MR-BT-Planner contributors" }]
keywords = ["behavior-trees", "multi-robot", "task-planning", "llm", "robotics"]
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.8"]
ui = ["gradio>=5,<6", "keyring>=25,<27"]
mujoco = [
    "mujoco>=3.3,<4",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "imageio>=2.34,<3",
    "imageio-ffmpeg>=0.5,<1",
    "pillow>=10,<13",
]
llm-bt = [
    "torch>=2.6,<3",
    "transformers>=4.42,<5",
]

[project.scripts]
lmrbtp = "llm_mr_bt_planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:llm_mr_bt_planner.*"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The research prompts and embedded HTML intentionally contain long literal lines;
# keep CI focused on correctness-oriented checks rather than reflowing artifacts.
ignore = ["E501", "UP035", "UP037", "B905"]

[tool.mypy]
python_version = "3.10"
packages = ["llm_mr_bt_planner"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
no_site_packages = true
